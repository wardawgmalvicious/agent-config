repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Scan staged changes for secrets (gitleaks)

  - repo: local
    hooks:
      - id: lint-skills
        name: Validate SKILL.md frontmatter
        entry: python scripts/lint-frontmatter.py
        language: python
        additional_dependencies: [pyyaml]
        files: '^skills/[^/]+/SKILL\.md$'
        types: [markdown]

      # README.md is documentation, not a rule — excluded so it isn't
      # required to carry `paths:` frontmatter.
      - id: lint-rules
        name: Validate rules frontmatter
        entry: python scripts/lint-frontmatter.py
        language: python
        additional_dependencies: [pyyaml]
        files: '^rules/(?!README\.md$)[^/]+\.md$'
        types: [markdown]

      # link-codex.ps1 validates required keys in agent TOMLs but never
      # parses them — a syntax error would still deploy. tomllib needs
      # Python 3.11+.
      - id: lint-codex-toml
        name: Validate Codex TOML parses
        entry: python -c "import sys, tomllib; [tomllib.load(open(p, 'rb')) for p in sys.argv[1:]]"
        language: python
        files: '^codex/.*\.toml$'
        types: [toml]
