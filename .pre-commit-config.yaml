repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Scan staged changes for secrets (gitleaks)

  - repo: local
    hooks:
      - id: lint-skills
        name: Validate SKILL.md frontmatter
        entry: python scripts/lint-frontmatter.py
        language: python
        additional_dependencies: [pyyaml]
        files: '^skills/[^/]+/SKILL\.md$'
        types: [markdown]

      # README.md is documentation, not a rule — excluded so it isn't
      # required to carry `paths:` frontmatter.
      - id: lint-rules
        name: Validate rules frontmatter
        entry: python scripts/lint-frontmatter.py
        language: python
        additional_dependencies: [pyyaml]
        files: '^claude/rules/(?!README\.md$)[^/]+\.md$'
        types: [markdown]

      # link-codex.ps1 validates required keys in agent TOMLs but never
      # parses them — a syntax error would still deploy. tomllib is
      # stdlib only from Python 3.11; tomli is the identical-API
      # fallback so the hook can't die with ImportError on whatever
      # interpreter pre-commit resolves.
      - id: lint-codex-toml
        name: Validate Codex TOML parses
        entry: python -c "import sys; toml = __import__('tomllib' if sys.version_info >= (3, 11) else 'tomli'); [toml.load(open(p, 'rb')) for p in sys.argv[1:]]"
        language: python
        additional_dependencies: [tomli]
        files: '^codex/.*\.toml$'
        types: [toml]
