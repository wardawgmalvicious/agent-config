# Three git hooks, not one: the identity guard below also gates the commit
# message and the push. `pre-commit install` reads this list, so a plain
# install (or scripts/bootstrap-pre-commit) wires all three. default_stages
# keeps every other hook on pre-commit only, where it ran before this list
# existed -- without it, each would also run at commit-msg and pre-push.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Scan staged changes for secrets (gitleaks)

  # ruff CHECK only -- `ruff format` is deliberately left out. It would
  # rewrite ~200 lines across all five scripts without fixing a single
  # defect, on files dense with dated measurements in comments, where
  # `git blame` is how you find when a claim was recorded.
  #
  # The rule selection lives in ruff.toml, pinned, rather than being left
  # to the default: on 0.16.5 a bare `ruff check` here selected PIE810 but
  # NOT E741, so the effective default is neither the documented E4/E7/E9/F
  # nor stable across releases. Unpinned, a version bump would change what
  # CI enforces with no commit to point at.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      # Scoped to scripts/ for the same reason tests/ is gitleaks-allowlisted:
      # the five .py files under tests/ are FIXTURES, and their defects are the
      # point. Unscoped, this hook fails on a bare `except`, an unused variable
      # and two undefined `spark` references that the code-review and
      # security-reviewer fixtures put there deliberately.
      - id: ruff-check
        name: Lint Python scripts (ruff)
        files: '^scripts/.*\.py$'

  - repo: local
    hooks:
      # Two skill trees at DIFFERENT DEPTHS, which is why this is one
      # alternation rather than one pattern. Deployable payload lives at
      # skills/<group>/<name>/SKILL.md, so the first arm consumes a group
      # segment; this repo's own maintenance skills live at project scope
      # in .claude/skills/<name>/SKILL.md with no group above them, so the
      # second arm consumes none. Both arms stay depth-pinned on purpose: a
      # skill placed flat or nested a level deeper is invisible to Claude
      # Code's one-level discovery, and matching it here would lint a file
      # nothing can ever load. Verify a change to this line with
      # `pre-commit run lint-skills --files <a path that should match>` --
      # a pattern that misses reports "(no files to check) Skipped", which
      # reads as success.
      - id: lint-skills
        name: Validate SKILL.md frontmatter
        entry: python scripts/lint-frontmatter.py
        language: python
        additional_dependencies: [pyyaml]
        files: '^(skills/[^/]+|\.claude/skills)/[^/]+/SKILL\.md$'
        types: [markdown]

      # README.md is documentation, not a rule — excluded so it isn't
      # required to carry `paths:` frontmatter.
      - id: lint-rules
        name: Validate rules frontmatter
        entry: python scripts/lint-frontmatter.py
        language: python
        additional_dependencies: [pyyaml]
        files: '^claude/rules/(?!README\.md$)[^/]+\.md$'
        types: [markdown]

      # A collision is a property of a PAIR of skills, so this runs over the
      # whole set rather than the changed files -- neither file is wrong on
      # its own and a per-file hook could never see it. Scoped to the two
      # skill trees because nothing outside them can create one.
      - id: lint-skill-scopes
        name: Check skill names are unique across both trees
        entry: python scripts/lint-skill-scopes.py
        language: python
        files: '^(skills/|\.claude/skills/)'
        pass_filenames: false

      # Coverage of the skillOverrides block is a property of the SET, like
      # the name collision above: the new skill's directory is not wrong and
      # settings.json is not wrong, the pair is -- so no per-file hook can
      # see it. That is how it went silent twice running, once per
      # /author-skill run (1c64590 for fabric-catalog-governance, then
      # fabric-activator the same day) -- the first caught only after the
      # skill had landed, the second by a hand-written probe before it
      # committed. `files:` spans both halves so editing either side re-checks
      # the pair, and settings.json is pinned with $ so settings.local.json
      # does not match it.
      - id: lint-skill-overrides
        name: Check platform skills are collapsed to name-only
        entry: python scripts/lint-skill-overrides.py
        language: python
        files: '^(skills/|\.claude/settings\.json$)'
        pass_filenames: false

      # The test stamps in tests/skills/.tested.json are keyed by skill name,
      # like skillOverrides, so a rename or deletion strands an entry the same
      # way. This checks only that. An UNTESTED skill is a legitimate state
      # and not a failure: /author-skill commits before /test-skill runs, by
      # design. `files:` spans the trees and the manifest so either side of
      # a rename re-checks the pair.
      - id: lint-skill-status
        name: Check test stamps name skills that still exist
        entry: python scripts/skill-status.py --check
        language: python
        additional_dependencies: [pyyaml]
        files: '^(skills/|\.claude/skills/|tests/skills/\.tested\.json$)'
        pass_filenames: false

      # copilot/instructions/*.instructions.md carry `applyTo`, not `paths:`,
      # so lint-frontmatter.py would reject every one and is scoped away from
      # them. This validates them instead, blocks a personal-repo name or
      # profile path reaching a client repo, and fails when a rule changes
      # without its hand-written port following. Runs over the whole set
      # rather than the changed files, since a rule edit and its port live in
      # different directories and either one alone is the interesting case.
      - id: lint-instructions
        name: Validate Copilot instructions and check port drift
        entry: python scripts/lint-instructions.py
        language: python
        additional_dependencies: [pyyaml]
        files: '^(claude/rules/|copilot/)'
        pass_filenames: false

      # The identity-guard Claude Code hook sees only commits Claude Code
      # issues. A commit from Copilot, VS Code's Source Control view or a
      # terminal passes none of its events -- which is how a client name
      # reached public main on 2026-09-10. Git runs these whoever commits.
      # Same script, same denylist (~/.config/identity-denylist.txt, never
      # in any repo), so the list has one reader. No list -> allow, which is
      # what makes this a no-op in CI rather than a failure.
      #
      # `bash` via language: system, not language: script -- the file is
      # 100644 in git, and script would fail CI as not executable. On this
      # machine that `bash` resolves to Git's, not WSL's, both under a git
      # hook and from `pre-commit run` in PowerShell, where Get-Command
      # bash names WSL (measured 2026-09-10: a staged term blocked both ways).
      - id: identity-guard
        name: Scan staged additions for denylisted identity strings
        entry: bash claude/hooks/identity-guard.sh --git-hook pre-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: identity-guard-message
        name: Scan the commit message for denylisted identity strings
        entry: bash claude/hooks/identity-guard.sh --git-hook commit-msg
        language: system
        always_run: true
        stages: [commit-msg]
      - id: identity-guard-push
        name: Scan unpushed commits for denylisted identity strings
        entry: bash claude/hooks/identity-guard.sh --git-hook pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # The identity guard catches names already on the list; this catches
      # everything else by refusing any push not issued from a Claude Code
      # session, so nothing another harness wrote goes public unreviewed.
      # Override for one push: `git -c agentconfig.push=reviewed push ...`.
      # Why that form and why CLAUDECODE is the marker: the script header.
      - id: push-gate
        name: Refuse pushes not issued from Claude Code
        entry: bash scripts/push-gate.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
