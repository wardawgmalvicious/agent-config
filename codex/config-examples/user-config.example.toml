# Example user-level Codex config — reference only, never deployed
# (link-codex.ps1 deliberately leaves config.toml home-owned).
# Destination when used: ~/.codex/config.toml
# Copy only the keys you need. Do not commit real secrets.
# model, model_reasoning_effort, and [windows] mirror the live machine
# config as of Aug 2026; the remaining keys are recommended defaults.

model = "gpt-5.6-sol"
model_reasoning_effort = "ultra"

# Good interactive default for trusted version-controlled repos.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Keep spawned shell commands from inheriting broad secret-heavy
# environments.
[shell_environment_policy]
inherit = "core"

[windows]
sandbox = "unelevated"

# Optional: global custom-agent limits.
[agents]
max_threads = 6
max_depth = 1

# MCP servers: see codex/mcp/codex-mcp.example.toml for copyable
# blocks. Prefer env_vars / bearer_token_env_var for secret values.
