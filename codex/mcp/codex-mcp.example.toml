# Codex MCP examples — TOML analogs of the Claude / VS Code JSON
# templates in mcp/ (see mcp/README.md for the server catalog,
# runtimes, and prerequisites).
# Copy selected blocks into ~/.codex/config.toml or, for trusted
# projects, <repo-root>/.codex/config.toml. Do not commit real secrets.

# Fabric core + OneLake + docs (npx; needs Node.js on PATH).
[mcp_servers.microsoft_fabric]
command = "cmd"
args = ["/c", "npx", "-y", "@microsoft/fabric-mcp@latest", "server", "start", "--mode", "all"]
enabled = false
startup_timeout_sec = 30
tool_timeout_sec = 120

# Fabric Real-Time Intelligence — KQL / Eventhouse / Eventstream /
# Activator (uvx; needs uv on PATH).
[mcp_servers.fabric_rti]
command = "uvx"
args = ["microsoft-fabric-rti-mcp"]
enabled = false
startup_timeout_sec = 30
tool_timeout_sec = 120

# Fabric Data Factory control plane (dnx; needs the .NET 10 SDK on
# PATH). Currently 0.x-beta, hence --prerelease.
[mcp_servers.fabric_data_factory]
command = "dnx"
args = ["Microsoft.DataFactory.MCP", "--prerelease", "--yes"]
enabled = false
startup_timeout_sec = 30
tool_timeout_sec = 120

# Docker MCP Gateway (needs Docker Desktop with the MCP Toolkit
# extension; enable servers per profile in the MCP Toolkit view).
# This mirrors the live machine config as of Aug 2026. Azure MCP is
# served through this gateway profile; if Docker is unavailable, a
# direct alternative is dnx Azure.Mcp@<version> (pin deliberately and
# validate — see mcp/README.md).
[mcp_servers.MCP_DOCKER]
command = "docker.exe"
args = ["mcp", "gateway", "run", "--profile", "developer"]
enabled = false

# Microsoft Learn docs search (hosted HTTP; no local runtime).
[mcp_servers.microsoft_learn]
url = "https://learn.microsoft.com/api/mcp"
enabled = false

# Fabric-hosted Power BI endpoint (HTTP with token from environment —
# use bearer_token_env_var, never a literal token). The Fabric-hosted
# endpoints authenticate cleanly from first-party clients; verify from
# Codex before relying on it (see the DCR notes in mcp/README.md).
[mcp_servers.powerbi_remote]
url = "https://api.fabric.microsoft.com/v1/mcp/powerbi"
bearer_token_env_var = "FABRIC_MCP_BEARER_TOKEN"
enabled = false

# Project-local Data API Builder MCP (project-scope config). Keep the
# connection string in DAB_CONNECTION_STRING or in DAB config patterns
# already approved by the repository. Do not hardcode credentials here.
[mcp_servers.project_sql]
command = "dab"
args = ["start", "--mcp-stdio"]
cwd = "C:\\path\\to\\repo"
env_vars = ["DAB_CONNECTION_STRING"]
enabled = false
