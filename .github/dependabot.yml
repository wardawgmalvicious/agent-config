version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
# No pip entry: Python dependencies here are inline (`uv run --with pyyaml`),
# so there is no manifest to read. The entry that stood here found nothing
# and failed on every scheduled run.
